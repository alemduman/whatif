name: tmp-battle-tts
on:
  push:
    branches: [tmp-battle-tts]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet edge-tts
      - run: python3 battle_tts.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Сохранить в ветку
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f out/ && git commit -qm "tts результат [skip ci]" && git push -q origin HEAD:tmp-battle-tts

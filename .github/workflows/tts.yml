name: tmp-battle-tts
on:
  push:
    branches: [tmp-battle-tts]
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet edge-tts
      - run: python3 battle_tts.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: tts
          path: out/

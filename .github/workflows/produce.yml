name: Сделать ролики

# Делает ролики из банка тем (topics/): кадры нейросетью (общие для всех языков), озвучка, видео EN и RU, обложки.
# Готовое кладётся в релиз "library" (видео не раздувают репозиторий), список готовых тем — в library.json.
# Запускается вручную или сам из автопостинга, когда в очереди остаётся мало роликов.
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Сколько новых тем сделать'
        type: string
        default: '3'
      ids:
        description: 'Конкретные темы через запятую (например sun-off,zombies). Пусто = следующие по порядку'
        type: string
        default: ''
      reuse_images:
        description: 'Если тема уже делалась, взять старые кадры (не платить за картинки повторно)'
        type: boolean
        default: true
      tts_only:
        description: 'Только эти движки озвучки через запятую (edge, gemini, openai, piper). Пусто = вся цепочка'
        type: string
        default: ''
      langs:
        description: 'Языки через запятую (пусто = все из config.json)'
        type: string
        default: ''
      probe_voices:
        description: 'Только диагностика голосов (ролики не делаются)'
        type: boolean
        default: false
      test:
        description: 'Пробная сборка: результат только в артефакте запуска (не в релизе и не в очереди). Без ключа — картинки-заглушки'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # модель распознавания речи (тайминги субтитров) и офлайн-голоса: не скачиваем каждый раз
      - name: Кэш моделей
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/piper
          key: models-v1

      - name: Установить зависимости
        timeout-minutes: 15
        run: |
          pip install --quiet edge-tts pillow numpy scipy opencv-python-headless faster-whisper piper-tts
          # ffmpeg: сначала готовая сборка из pip (apt у GitHub иногда зависает), apt — запасной путь
          if ! command -v ffmpeg >/dev/null; then
            pip install --quiet imageio-ffmpeg && sudo ln -sf "$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg || true
          fi
          command -v ffmpeg >/dev/null || (timeout 240 sudo apt-get update -qq; timeout 300 sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -n 1

      - name: Проверить банк тем
        run: python3 scripts/produce.py --check

      - name: Диагностика голосов
        if: inputs.probe_voices
        run: python3 scripts/tts_probe.py zombies

      - name: Сделать ролики
        if: ${{ !inputs.probe_voices }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REUSE_IMAGES: ${{ inputs.reuse_images && '1' || '0' }}
          COUNT: ${{ inputs.count }}
          IDS: ${{ inputs.ids }}
          LANGS: ${{ inputs.langs }}
          TTS_ONLY: ${{ inputs.tts_only }}
          TEST: ${{ inputs.test }}
        run: |
          prov=$(python3 -c "import json;print(json.load(open('config.json'))['images'].get('provider','gemini'))")
          if [ "$TEST" = "true" ]; then
            if { [ "$prov" = "gemini" ] && [ -z "$GEMINI_API_KEY" ]; } || { [ "$prov" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; }; then
              echo "::warning::Нет ключа для картинок ($prov): пробная сборка с картинками-заглушками"
              export IMAGE_PROVIDER=placeholder
            fi
          fi
          python3 scripts/produce.py --count "${COUNT:-3}" --ids "$IDS" --langs "$LANGS"

      - name: Сохранить пробную сборку
        if: inputs.test
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: |
            out/*/*.mp4
            out/*/*.jpg
            out/*/*.json
          retention-days: 7

      # копия в отдельную ветку: так пробные ролики можно забрать через git (ветка каждый раз перезаписывается)
      - name: Копия сборки в ветку test-videos
        if: hashFiles('out/produced.json') != ''
        run: |
          d="$RUNNER_TEMP/tv"; mkdir -p "$d"; cp out/*/*.mp4 out/*/*.jpg out/*/*.json out/*/*.images.zip assets/hero.png "$d"/ 2>/dev/null || true
          cd "$d" && git init -q -b test-videos && git add -A
          git -c user.name="whatif-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Пробная сборка ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:test-videos

      - name: Выложить в релиз library
        if: ${{ !inputs.test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f out/produced.json ] || { echo "Ничего не сделано"; exit 0; }
          gh release view library >/dev/null 2>&1 || gh release create library --title "Готовые ролики" --notes "Ролики «Что если?»: <id>.en.mp4 — Instagram, <id>.ru.mp4 — TikTok, обложки .jpg, кадры .images.zip"
          files=$(ls out/*/*.mp4 out/*/*.jpg out/*/*.json out/*/*.images.zip 2>/dev/null)
          for i in 1 2 3; do gh release upload library $files --clobber && break; echo "повтор загрузки"; sleep 15; done
          {
            echo "### Готово"
            python3 -c "import json;[print(f\"- **{p['id']}**: \" + ', '.join(f\"{k} {v['seconds']} с\" for k,v in p['langs'].items())) for p in json.load(open('out/produced.json'))]"
            echo ""
            echo "Файлы: релиз **library** (Releases)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Записать в library.json
        if: ${{ !inputs.test && hashFiles('out/produced.json') != '' }}
        run: |
          git config user.name "whatif-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp out/produced.json "$RUNNER_TEMP/produced.json"
          [ -f assets/hero.png ] && cp assets/hero.png "$RUNNER_TEMP/hero.png"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/add_library.py "$RUNNER_TEMP/produced.json"
            if [ -f "$RUNNER_TEMP/hero.png" ] && [ ! -f assets/hero.png ]; then mkdir -p assets && cp "$RUNNER_TEMP/hero.png" assets/hero.png && git add assets/hero.png; fi
            git add library.json
            git commit -q -m "Готовые ролики: $(python3 -c "import json;print(', '.join(p['id'] for p in json.load(open('$RUNNER_TEMP/produced.json'))))")" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
